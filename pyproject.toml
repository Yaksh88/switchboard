[project]
name = "switchboard"
version = "0.1.0"
description = "Self-hosted LLM gateway with routing, caching, rate limiting, cost tracking and evals."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yaksh Patel" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "numpy>=2.4.6",
    "sqlalchemy[asyncio]>=2.1.9",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "typer>=0.29.1",
    "rich>=15.0.0",
    "prometheus-client>=0.26.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
switchboard = "switchboard.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "types-pyyaml",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires running Postgres and Redis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["switchboard"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
