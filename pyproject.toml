[project]
name = "switchboard"
version = "0.1.0"
description = "Self-hosted LLM gateway with routing, caching, rate limiting, cost tracking and evals."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yaksh Patel" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "redis>=5.0",
    "numpy>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13",
    "prometheus-client>=0.20",
]

[project.scripts]
switchboard = "switchboard.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires running Postgres and Redis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["switchboard"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
